[server]
headless = true
# 关闭对 site-packages 的文件监视，避免 transformers 懒加载刷屏警告
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#00ff41"
backgroundColor = "#06080d"
secondaryBackgroundColor = "#0d1117"
textColor = "#c9d1d9"
font = "monospace"

[client]
toolbarMode = "minimal"
